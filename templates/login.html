<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Secure Vault - Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body class="auth-page">
    <div class="auth-shell">
        <div class="auth-card">
            <div class="auth-brand">
                <div class="logo">SV</div>
                <h1>Secure Vault</h1>
                <p>Secure login for your encrypted files and notes.</p>
            </div>
            <form action="{{ url_for('login') }}" method="post" class="auth-form">
                <label>Username</label>
                <input type="text" name="username" placeholder="Enter your username" required />
                <label>Password</label>
                <input type="password" name="password" placeholder="Enter your password" required />
                <label>2FA Token (if enabled)</label>
                <input type="text" name="twofa_token" placeholder="Enter 2FA code" />
                <button type="submit" class="btn-primary">Log In</button>
            </form>
            <p class="auth-footer">
                <a href="{{ url_for('forgot_password') }}">Forgot password?</a><br>
                Don't have an account? <a href="{{ url_for('register') }}">Register now</a>
            </p>
        </div>
    </div>
</body>
</html>
