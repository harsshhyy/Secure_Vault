<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Secure Vault - Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body class="auth-page">
    <div class="auth-shell">
        <div class="auth-card">
            <div class="auth-brand">
                <div class="logo">SV</div>
                <div>
                    <h1 class="auth-title">Secure Vault</h1>
                    <p class="auth-subtitle">Enterprise-class adaptive security for your encrypted digital vault.</p>
                </div>
            </div>
            <form action="{{ url_for('login') }}" method="post" class="auth-form">
                <div class="input-group">
                    <label for="username">Username or Email</label>
                    <input id="username" type="text" name="username" placeholder="Enter your username or email" required />
                </div>
                <div class="input-group">
                    <label for="password">Password</label>
                    <input id="password" type="password" name="password" placeholder="Enter your password" required />
                </div>
                <button type="submit" class="btn-primary">Secure Sign In</button>
                <div class="form-status">
                    <span class="status-active">Trusted Device</span>
                    <span>AI Monitoring Enabled</span>
                </div>
            </form>
            <div class="form-note">
                <p>Security status</p>
                <div class="status-pill secure">Secure connection</div>
                <div class="status-pill alert">Risk-adaptive authentication active</div>
            </div>
            <div class="form-note" style="margin-top:1rem;">
                <a href="{{ url_for('forgot_password') }}">Forgot password?</a> • <a href="{{ url_for('register') }}">Register an account</a>
            </div>
        </div>
    </div>
    <script src="{{ url_for('static', filename='js/device_fingerprint.js') }}"></script>
</body>
</html>
